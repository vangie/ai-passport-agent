name: PassportMac
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
  bundleIdPrefix: ai.mirasim
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: ""
targets:
  PassportMac:
    type: application
    platform: macOS
    sources:
      - path: PassportMac
      - path: ../shared
    dependencies:
      - sdk: CoreWLAN.framework
    info:
      path: PassportMac/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.mirasim.passport.configuration
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - ai-passport-openclaw
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: ai.mirasim.passport.mac
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_NAME: AI Passport OpenClaw
      INFOPLIST_KEY_CFBundleDisplayName: AI Passport OpenClaw
      INFOPLIST_KEY_NSLocationUsageDescription: Allow Location access to see nearby Wi-Fi names and choose a network for AI Passport.
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Allow Location access to see nearby Wi-Fi names and choose a network for AI Passport.
      MARKETING_VERSION: "0.4.1"
      CURRENT_PROJECT_VERSION: "1"
      ENABLE_APP_SANDBOX: NO
