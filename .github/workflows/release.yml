name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-tests:
    uses: ./.github/workflows/static-checks.yml

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 tools/release.py check-version --tag "$RELEASE_TAG"
          else
            python3 tools/release.py check-version
          fi
      - name: Check public sources
        run: |
          python3 tools/check_repo.py
          python3 tools/check_public.py
          bash tools/check-secrets.sh
          actionlint_bin="$(./tools/install-actionlint.sh)"
          "$actionlint_bin" .github/workflows/*.yml

  firmware:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .ccache
          key: release-ccache-${{ github.sha }}
          restore-keys: release-ccache-
      - name: Prepare host-owned packaging directory
        run: mkdir -p build/release
      - name: Build and verify firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware
      - name: Package only distributable firmware
        run: |
          python3 tools/release.py firmware build/release/firmware
          tar -czf build/release/ai-passport-agent-firmware.tar.gz -C build/release/firmware .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-firmware
          path: build/release/
          if-no-files-found: error

  plugin:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: npm ci --prefix tools/openclaw --omit=peer --ignore-scripts --no-audit --no-fund
      - run: make plugin-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-plugin
          path: build/openclaw/*.tgz
          if-no-files-found: error

  hermes:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Package external Hermes plugin
        run: python3 tools/release.py hermes-package build/hermes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-hermes
          path: build/hermes/*.tar.gz
          if-no-files-found: error

  web-checks:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - run: npx --prefix web playwright install --with-deps chromium
      - run: python3 tools/web.py prepare
      - run: npm test --prefix web && npm run test:ui --prefix web

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [audit, host-tests, firmware, plugin, hermes, web-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: build/downloads
      - name: Prepare versioned assets and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release.py prepare-assets build/downloads dist \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Upload and verify draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tail -n +3 docs/release/notes.md > build/release-notes.md
          printf '\n---\n\n' >> build/release-notes.md
          tail -n +3 docs/release/notes.zh_CN.md >> build/release-notes.md
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"; then
            [[ "$draft" == true ]] || { echo 'Refusing to overwrite a published release'; exit 1; }
            gh release edit "$RELEASE_TAG" --notes-file build/release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "AI Passport Agent $RELEASE_TAG" --notes-file build/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release download "$RELEASE_TAG" --dir build/release-verification
          python3 tools/release.py verify-assets build/release-verification \
            --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
          gh release edit "$RELEASE_TAG" --draft=false --latest
