name: Web configuration studio

on:
  pull_request:
    paths: &web-paths ['web/**', 'assets/logo/logo.png', 'assets/images/passport-lobster.svg', 'tools/web.py', 'tools/web_preview.py', 'tools/check_public.py', 'tools/check_web_public.py', 'tools/check-secrets.sh', 'tests/test_public_audit.py', 'tests/test_web_public.py', 'tests/test_web_preview.py', 'tests/test_web_firmware.py', 'Makefile', 'shared/PairPrompt.swift', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: *web-paths
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Audit source privacy before building
        run: |
          python3 tools/check_public.py
          bash tools/check-secrets.sh
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_public_audit.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/test_web_public.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - run: python3 tools/web.py prepare
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tests/test_web_preview.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 tests/test_web_firmware.py
      - run: npm test --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm run test:ui --prefix web
      - name: Stage verified release firmware on the same origin
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$EVENT_TAG"
          if [ -z "$tag" ]; then tag="$(gh release view --json tagName --jq .tagName)"; fi
          mkdir -p build/web-release
          gh release download "$tag" --dir build/web-release \
            --pattern release-manifest.json --pattern FoloToy-AI-Passport.bin --pattern FoloToy-AI-Passport-full.bin
          gh release list --exclude-drafts --exclude-pre-releases --limit 12 --json tagName --jq '.[].tagName' > build/web-release-tags.txt
          while IFS= read -r previous; do
            if [[ ! "$previous" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then continue; fi
            mkdir -p "build/web-history/$previous"
            gh release download "$previous" --dir "build/web-history/$previous" \
              --pattern release-manifest.json --pattern SHA256SUMS.txt --pattern FoloToy-AI-Passport.bin
          done < build/web-release-tags.txt
          python3 tools/web.py firmware --from-release build/web-release --release-history build/web-history
      - run: npm run build --prefix web
      - name: Audit the exact Pages artifact
        env:
          REQUIRE_FIRMWARE: ${{ github.event_name != 'pull_request' && '--require-firmware' || '' }}
        run: python3 tools/check_web_public.py web/dist $REQUIRE_FIRMWARE
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static configuration studio
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
