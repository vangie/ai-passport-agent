name: Badge
options:
  bundleIdPrefix: ai.mirasim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: ""
targets:
  Badge:
    type: application
    platform: iOS
    sources:
      - path: Badge
      - path: ../shared
    info:
      path: Badge/Info.plist
      properties:
        CFBundleDisplayName: OpenClaw
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: ai.mirasim.passport.configuration
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - ai-passport-openclaw
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 用来读取和修改 AI Passport 上的 Wi-Fi 与 OpenClaw 配置。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: ai.mirasim.badge
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: NO
