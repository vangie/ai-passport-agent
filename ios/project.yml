name: Passport
options:
  bundleIdPrefix: ai.mirasim
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  CODE_SIGN_STYLE: Automatic
  DEVELOPMENT_TEAM: ""
targets:
  Passport:
    type: application
    platform: iOS
    sources:
      - path: Passport
      - path: ../shared
    info:
      path: Passport/Info.plist
      properties:
        CFBundleDisplayName: AI Passport
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: ai.mirasim.passport.configuration
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - ai-passport-openclaw
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: 用来读取和修改 AI Passport 上的 Wi-Fi 与 OpenClaw 配置。
        UIBackgroundModes:
          - bluetooth-central
        NSCameraUsageDescription: 用来扫描 OpenClaw 的配对二维码。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: ai.mirasim.passport
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: NO
      MARKETING_VERSION: "0.4.0"
      CURRENT_PROJECT_VERSION: "1"
  PassportUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PassportUITests
    dependencies:
      - target: Passport
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ai.mirasim.passport.uitests
      GENERATE_INFOPLIST_FILE: YES
schemes:
  Passport:
    build:
      targets:
        Passport: all
    test:
      targets:
        - PassportUITests
